name: 서울 상권 시험

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 시험
        run: |
          mkdir -p build
          python scripts/seoul_probe.py > build/seoul_probe.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/seoul_probe.txt && git commit -m "서울 상권 시험 결과" && git pull --rebase && git push
