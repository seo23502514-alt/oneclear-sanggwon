name: probe-region
on: { push: { paths: ['.github/workflows/probe-region.yml'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e; mkdir -p build; O=build/probe_region.txt; : > $O
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          for id in B7BIA8NM4VIXSPPQQV0132089283 H92OOSWZXICJM0UO4IHH38259217 VC8S8H646TPGS80AKMU630453421 7Y02TF04H1WUB55Q4IZL35052374; do
            for s in 1 2 3; do
              curl -sL -A "$UA" -m 40 "https://data.gg.go.kr/portal/data/service/selectServicePage.do?infId=$id&infSeq=$s" -o p.html
              echo "== $id seq$s size $(wc -c < p.html)" >> $O
              grep -oiE '(openapi\.gg\.go\.kr/[A-Za-z0-9_]+|srvNm[^,]{0,60}|apiNm[^,]{0,60}|<title>[^<]*|이용허락[^<]{0,80}|공공누리[^<]{0,60}|CC[- ]?BY[^<]{0,30})' p.html | sort -u | head -20 >> $O
              grep -oE 'fileDownload[^"]{0,200}|atchFileId[^"&]{0,60}' p.html | sort -u | head -5 >> $O
            done
          done
          curl -s -m 30 "https://openapi.gg.go.kr/Tbgg" | head -c 400 >> $O
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add build/probe_region.txt; git commit -m "probe region" && git pull --rebase && git push || true
