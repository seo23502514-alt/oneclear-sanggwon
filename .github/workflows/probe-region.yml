name: probe-region
on: { push: { paths: ['.github/workflows/probe-region.yml'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: probe
        env: { SEOUL_KEY: "${{ secrets.SEOUL_KEY }}" }
        run: |
          set +e; mkdir -p build
          python - <<'PY' > build/probe_region.txt 2>&1
          import sys, json; sys.path.insert(0,'scripts')
          import fetch_seoul as F
          for svc in ['VwsmAdstrdSelngW','VwsmAdstrdStorW','VwsmAdstrdFlpopW']:
              try:
                  q=F.latest_q(svc); print(svc,'latest',q)
                  t,r=F.api(svc,1,2,q); print(t, json.dumps(r[:1],ensure_ascii=False))
              except Exception as e: print(svc,'ERR',e)
          q=F.latest_q('VwsmAdstrdSelngW')
          rows=[r for r in F.fetch_all('VwsmAdstrdSelngW',q) if r['SVC_INDUTY_CD']=='CS100010']
          st=[r for r in F.fetch_all('VwsmAdstrdStorW',q) if r['SVC_INDUTY_CD']=='CS100010']
          json.dump({'q':q,'sales':[[r['ADSTRD_CD'],F.n(r['THSMON_SELNG_AMT']),F.n(r['THSMON_SELNG_CO'])] for r in rows],
                     'stores':[[r['ADSTRD_CD'],F.n(r['STOR_CO']),F.n(r.get('SIMILR_INDUTY_STOR_CO'))] for r in st]},
                    open('build/seoul_dong_sales.json','w'),ensure_ascii=False)
          print('rows',len(rows),len(st))
          PY
          for h in data.gg.go.kr openapi.gg.go.kr bigdata.sbiz.or.kr sbiz.gmr.or.kr www.data.go.kr; do echo "$h $(curl -s -o /dev/null -w '%{http_code}' -m 20 https://$h/)" >> build/probe_region.txt; done
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add build/probe_region.txt build/seoul_dong_sales.json; git commit -m "probe region" && git pull --rebase && git push || true
