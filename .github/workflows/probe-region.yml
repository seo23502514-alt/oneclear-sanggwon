name: probe-region
on: { push: { paths: ['.github/workflows/probe-region.yml'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e; mkdir -p build; O=build/probe_region.txt; : > $O
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          for id in B7BIA8NM4VIXSPPQQV0132089283 H92OOSWZXICJM0UO4IHH38259217; do
            curl -sL -A "$UA" -m 40 "https://data.gg.go.kr/portal/data/service/selectServicePage.do?infId=$id&infSeq=2" -o build/gg_$id.html
          done
          curl -s -A "$UA" -m 30 "https://openapi.gg.go.kr/RegionMnyFacltStus?Type=json&pIndex=1&pSize=2" | head -c 600 >> $O
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add build/probe_region.txt build/gg_*.html; git commit -m "probe region" && git pull --rebase && git push || true
