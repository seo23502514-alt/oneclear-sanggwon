name: fetch
on:
  push:
    branches: [fetch]
    paths: ["req.json"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow beautifulsoup4
      - run: python fetch.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A out; git commit -qm "fetch results" || true; git push
