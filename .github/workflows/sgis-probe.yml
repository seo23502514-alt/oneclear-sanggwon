name: SGIS 시험

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: SGIS 사업체통계 시험
        env:
          SGIS_KEY: ${{ secrets.SGIS_KEY }}
          SGIS_SECRET: ${{ secrets.SGIS_SECRET }}
        run: python scripts/sgis_probe.py
