<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카페 장비 시각가이드 · 장비찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c1f24;--muted:#6b7280;--line:#e3e6ea;--brand:#6b4226;--brand2:#8a5634;--accent:#c8742f;--ok:#2e8b57;--warn:#d9822b;--bad:#c0392b;
--c-ext:#7a4a2a;--c-cold:#2f6f8f;--c-bev:#8a5a9a;--c-wash:#3f8a6a;--c-heat:#c0532f;--c-etc:#5f6670}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.top{background:var(--brand);color:#fff}
.top .in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px;height:60px}
.logo{font-weight:900;font-size:18px;letter-spacing:-.4px;white-space:nowrap}
.logo small{font-weight:500;opacity:.7;font-size:12px;margin-left:6px}
nav{display:flex;gap:4px;height:100%}
nav button{font:inherit;font-size:14.5px;font-weight:700;color:rgba(255,255,255,.7);background:none;border:0;padding:0 14px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--accent)}
.view{display:none}.view.on{display:block}
.layout{max-width:1280px;margin:0 auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.report,.side{min-width:0}
/* side form */
.side{background:#fff;border:1px solid var(--line);border-radius:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side h2{margin:0;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line)}
.step{border-bottom:1px solid var(--line)}
.step summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.step summary::-webkit-details-marker{display:none}
.num{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.step .sum{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted);text-align:right}
.fields{padding:0 18px 16px;display:grid;gap:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input[type=number],.f select{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{font-size:13px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;color:var(--ink);margin:0}
.checks input{display:none}
.checks label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range b{min-width:46px;text-align:right;font-size:14px}
.go{display:block;width:calc(100% - 36px);margin:16px 18px 18px;font:inherit;font-size:15px;font-weight:900;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.go:hover{filter:brightness(.95)}
/* report */
.report{display:grid;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .desc{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.rhead{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:14px;padding:20px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.rhead h2{margin:0;font-size:20px}
.rhead p{margin:4px 0 0;opacity:.85;font-size:13px}
.grade{margin-left:auto;text-align:center;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 18px}
.grade b{display:block;font-size:30px;line-height:1.1}
.grade span{font-size:12px;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
@media(max-width:520px){.layout{padding:12px}.panel{padding:14px}.bar{grid-template-columns:90px 1fr 50px}.rhead{padding:16px}}
.kpi .v{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .s{font-size:12px;margin-top:4px}
.tone-ok{color:var(--ok)}.tone-warn{color:var(--warn)}.tone-bad{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.gauge{height:18px;background:#eef0f3;border-radius:9px;position:relative;overflow:visible;margin:24px 0 8px}
.gauge .fill{height:100%;border-radius:9px}
.gauge .cap{position:absolute;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.gauge .cap::after{content:"";position:absolute;left:50%;top:18px;width:2px;height:26px;background:var(--ink)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:12px;background:#eef0f3;border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.bar .n{text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center}
td .ic svg{width:24px;height:24px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;background:var(--accent)}
.pill.opt{background:#9aa1ab}
.why{color:var(--muted);font-size:12.5px}
td a{color:var(--brand);font-weight:700;font-size:12.5px;white-space:nowrap}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:13.5px}
.alert.bad{background:#fbeceb}.alert.warn{background:#fdf2e6}.alert.ok{background:#e9f5ee}
.alert b{flex:none}
.strip{display:flex;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:6px 0 4px}
.strip div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;border-right:1px solid rgba(255,255,255,.5);overflow:hidden;white-space:nowrap;padding:0 2px}
.striplbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}
.empty-r{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-r b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.foot{font-size:12px;color:var(--muted);padding:4px 2px 30px}
/* dictionary view */
.dict{max-width:1280px;margin:0 auto;padding:20px}
.dtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dtools input{flex:1;min-width:220px;font:inherit;font-size:15px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px}
.chip{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.art{height:110px;display:flex;align-items:center;justify-content:center}
.art svg{width:76px;height:76px}
.cbody{padding:12px 14px 14px}
.cbody .c{font-size:12px;font-weight:700}
.cbody h4{margin:2px 0;font-size:16px}
.cbody p{margin:4px 0 0;font-size:13px;color:#444}
.scrim{position:fixed;inset:0;background:rgba(15,15,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.modal h2{margin:0 0 4px}
.modal ul{padding-left:18px}
.modal .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.buy a{display:inline-block;margin:6px 6px 0 0;font-size:14px;font-weight:700;text-decoration:none;padding:9px 14px;border-radius:10px;border:1.5px solid var(--ink);color:var(--ink)}
.buy a:first-child{background:var(--ink);color:#fff}
.psearch{margin-left:auto;display:flex;gap:6px;flex:1;max-width:460px}
.psearch input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:0;background:rgba(255,255,255,.95)}
.psearch button{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
@media(max-width:820px){.top .in{flex-wrap:wrap;height:auto;padding:10px 20px}.psearch{order:3;max-width:none;flex-basis:100%}nav{height:44px}}
.pres h2{margin:0 0 2px;font-size:20px;word-break:break-all}
.pres .det{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;margin:14px 0;cursor:pointer}
.pres .det .ic{width:56px;height:56px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pres .det .ic svg{width:40px;height:40px}
.pres .det b{display:block;font-size:16px}
.pres .det span{font-size:12.5px;color:var(--muted)}
.pres h3{font-size:13px;color:var(--muted);margin:16px 0 6px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:block;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.links a small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.links a:hover{border-color:var(--ink)}
.recent{display:flex;flex-wrap:wrap;gap:6px}
.recent button{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#f6f7f9;cursor:pointer}
/* 좁은 화면: 입력창이 리포트를 덮지 않게 */
@media(max-width:900px){.side{position:static;max-height:none;overflow:visible}}
.fields,.f,.row2>*{min-width:0}
.checks label{white-space:nowrap}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
.rhead>div{min-width:0}.rhead p{word-break:keep-all}
@media(max-width:520px){.kpi .v{font-size:22px}.kpi{padding:12px}.grade{margin-left:0}}
.report{grid-template-columns:minmax(0,1fr)}.strip div{min-width:0}
.barwrap{max-width:1400px;margin:0 auto;padding:20px;display:grid;gap:16px}
.bartools{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.bartools .f{min-width:130px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btns button,.selbtn button{font:inherit;font-size:13.5px;font-weight:700;padding:9px 12px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
.btns button:first-child{background:var(--ink);color:#fff}
.barmsg{font-size:12.5px;color:var(--ok);flex-basis:100%}
.barmsg:empty{display:none}
.bargrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1000px){.bargrid{grid-template-columns:minmax(0,1fr)}}
.barcv h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
#barcanvas svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;border-radius:10px;border:1px solid var(--line)}
#barside{display:grid;gap:12px}
.selp{border-color:var(--ink)}
.selbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.wlab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.wlab input{width:110px;font:inherit;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px}
.blist{margin:4px 0 12px;padding-left:20px;font-size:13px}
.blist li span{color:var(--muted);float:right}
.blist li.u{color:var(--muted)}
.tobar{font:inherit;font-weight:900;font-size:14px;padding:11px 16px;border-radius:10px;border:0;background:#fff;color:var(--brand);cursor:pointer}
@media print{.top,.bartools,#barside .selp,.view:not(#v-bar){display:none!important}.bargrid{grid-template-columns:1fr}}
.ppick{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.ppick input,.pmanual input{font:inherit;font-size:13.5px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;width:100%}
#pplist{display:grid;gap:4px;max-height:220px;overflow:auto}
.pitem{font:inherit;text-align:left;border:1px solid var(--line);background:#fafafa;border-radius:8px;padding:7px 9px;cursor:pointer}
.pitem:hover{border-color:var(--ink)}.pitem span{display:block;font-size:13px;font-weight:700}.pitem small{color:var(--muted);font-size:12px}
.pmanual summary{cursor:pointer;font-size:13px;color:var(--brand);font-weight:700;margin:4px 0}
.pmanual{display:grid;gap:6px}.pmanual .row2{gap:6px}
.pmanual button{font:inherit;font-weight:700;padding:8px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;margin-top:6px}
.plist{display:grid;gap:6px}.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.prow b{display:block;font-size:14px}.prow small{color:var(--muted);font-size:12px}
.prow button{font:inherit;font-size:13px;font-weight:700;padding:8px 10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="logo">장비찾기 <small>카페 장비 시각가이드</small></div>
  <nav><button class="on" data-v="analyze">장비 구성 분석</button><button data-v="bar">바 설계</button><button data-v="dict">장비 사전</button></nav>
  <form class="psearch" id="pform"><input id="pq" type="search" placeholder="제품명·모델명 검색 (예: 시모넬리 아피아, 호시자키 제빙기)" aria-label="제품명 검색"><button type="submit">검색</button></form>
</div></div>

<section class="view on" id="v-analyze">
<div class="layout">
  <aside class="side">
    <h2>매장 조건 입력</h2>
    <details class="step" open><summary><span class="num">1</span>매장 기본<span class="sum" id="sum1"></span></summary>
      <div class="fields">
        <div class="row2">
          <div class="f"><label>매장 면적 (평)</label><input type="number" id="area" value="20" min="5" max="200"></div>
          <div class="f"><label>좌석 수</label><input type="number" id="seats" value="24" min="0" max="300"></div>
        </div>
        <div class="f"><label>매장 형태</label>
          <select id="type"><option value="takeout">테이크아웃 중심</option><option value="hall" selected>홀 중심 카페</option><option value="dessert">디저트 카페</option><option value="senior">시니어 운영 카페</option></select></div>
      </div></details>
    <details class="step" open><summary><span class="num">2</span>메뉴 구성<span class="sum" id="sum2"></span></summary>
      <div class="fields"><div class="checks" id="menus">
        <label><input type="checkbox" value="espresso" checked>에스프레소·라떼</label>
        <label><input type="checkbox" value="drip">핸드드립</label>
        <label><input type="checkbox" value="coldbrew">콜드브루</label>
        <label><input type="checkbox" value="smoothie" checked>스무디·프라페</label>
        <label><input type="checkbox" value="ade" checked>에이드·아이스티</label>
        <label><input type="checkbox" value="tea">차·청 직접 제조</label>
        <label><input type="checkbox" value="bake">디저트 굽기</label>
        <label><input type="checkbox" value="waffle">와플·토스트</label>
        <label><input type="checkbox" value="cake">케이크 진열</label>
        <label><input type="checkbox" value="bottle">병음료 판매</label>
      </div></div></details>
    <details class="step" open><summary><span class="num">3</span>예상 판매량<span class="sum" id="sum3"></span></summary>
      <div class="fields">
        <div class="f"><label>하루 판매 잔 수</label><div class="range"><input type="range" id="cups" min="20" max="600" step="10" value="150"><b id="cupsv"></b></div></div>
        <div class="f"><label>아이스 음료 비율 (여름 기준)</label><div class="range"><input type="range" id="icer" min="0" max="100" step="5" value="65"><b id="icerv"></b></div></div>
        <div class="f"><label>가장 바쁜 1시간에 팔리는 비율</label><div class="range"><input type="range" id="peak" min="5" max="40" step="1" value="18"><b id="peakv"></b></div></div>
      </div></details>
    <details class="step" open><summary><span class="num">4</span>운영·설비<span class="sum" id="sum4"></span></summary>
      <div class="fields">
        <div class="row2">
          <div class="f"><label>근무 인원 (피크)</label><input type="number" id="staff" value="2" min="1" max="10"></div>
          <div class="f"><label>계약 전력 (kW)</label><input type="number" id="power" value="20" min="3" max="200"></div>
        </div>
        <div class="row2">
          <div class="f"><label>프론트 카운터 길이 (mm)</label><input type="number" id="front" value="4000" step="100"></div>
          <div class="f"><label>백 카운터 길이 (mm)</label><input type="number" id="back" value="3500" step="100"></div>
        </div>
      </div></details>
    <button class="go" id="go">분석하기</button>
  </aside>

  <div class="report" id="report">
    <div class="panel empty-r"><b>왼쪽에 매장 조건을 넣고 분석하기를 눌러 주세요</b>추천 장비 구성, 전력 부하, 얼음 필요량, 카운터 배치 길이를 리포트로 보여 드립니다.</div>
  </div>
</div>
</section>

<section class="view" id="v-bar">
<div class="barwrap">
  <div class="bartools panel">
    <div class="f"><label>바 형태</label><select id="bShape"><option value="parallel">11자형 (프론트+백)</option><option value="L">ㄱ자형</option><option value="line">일자형 (한 줄)</option></select></div>
    <div class="f"><label>픽업 위치</label><select id="bPick"><option value="right">오른쪽</option><option value="left">왼쪽</option></select></div>
    <div class="f"><label>프론트 길이 (mm)</label><input type="number" id="bFl" value="4000" step="100"></div>
    <div class="f"><label>백·옆 길이 (mm)</label><input type="number" id="bBl" value="3500" step="100"></div>
    <div class="f"><label>프론트 깊이 (mm)</label><input type="number" id="bFd" value="700" step="50"></div>
    <div class="f"><label>백 깊이 (mm)</label><input type="number" id="bBd" value="600" step="50"></div>
    <div class="f"><label>통로 폭 (mm)</label><input type="number" id="bAisle" value="1000" step="50"></div>
    <div class="btns"><button id="bReset">조건대로 다시 배치</button><button id="bPng">PNG 저장</button><button id="bPrint">인쇄</button></div>
    <span id="barmsg" class="barmsg"></span>
  </div>

// 장비별 대략 기준값: 소비전력 kW(대표값), 차지 폭 mm, 놓는 곳
const SPEC = {
 espresso:{kw:{1:2.8,2:4.5,3:6.5},w:{1:550,2:800,3:1050},z:"front"},
 grinder:{kw:0.5,w:250,z:"front"},
 drip:{kw:1.5,w:500,z:"front"},
 coldbrew:{kw:0,w:500,z:"back"},
 tablefridge:{kw:0.35,w:0,z:"under"},
 showcase:{kw:0.6,w:900,z:"front"},
 ice:{kw:0.9,w:600,z:"back"},
 freezer:{kw:0.4,w:650,z:"back"},
 blender:{kw:1.5,w:250,z:"front"},
 hotwater:{kw:3,w:300,z:"front"},
 dispenser:{kw:0.3,w:400,z:"back"},
 pitcher:{kw:0,w:0,z:"none"},
 dishwasher:{kw:5,w:0,z:"under"},
 sterilizer:{kw:0.5,w:600,z:"back"},
 filter:{kw:0,w:0,z:"none"},
 sink:{kw:0,w:600,z:"back"},
 induction:{kw:3,w:400,z:"back"},
 oven:{kw:3.5,w:600,z:"back"},
 waffle:{kw:1.8,w:350,z:"back"},
 pos:{kw:0.2,w:450,z:"front"},
 scale:{kw:0,w:0,z:"none"},
 tamper:{kw:0,w:0,z:"none"},
 knock:{kw:0,w:150,z:"front"}
};
const ICE_SIZES=[30,50,70,100,150,200];
const val=id=>+document.getElementById(id).value;

function analyze(silent){
  const area=val("area"),seats=val("seats"),type=document.getElementById("type").value;
  const menus=[...document.querySelectorAll("#menus input:checked")].map(i=>i.value);
  const has=m=>menus.includes(m);
  const cups=val("cups"),icer=val("icer")/100,peakr=val("peak")/100,staff=val("staff"),power=val("power"),front=val("front"),back=val("back");
  const peak=Math.round(cups*peakr);
  const senior=type==="senior";
  const rec=[]; // {id,qty,spec,why,must,kw,w,z}
  const add=(id,qty,spec,why,must=true,kwOverride,wOverride)=>{
    const s=SPEC[id]; rec.push({id,qty,spec,why,must,kw:(kwOverride??s.kw)*qty,w:(wOverride??s.w)*qty,z:s.z});
  };
  // 에스프레소
  let groups=0;
  if(has("espresso")){
    groups = peak<=25 && cups<=80 ? 1 : (peak<=70 ? 2 : 3);
    add("espresso",1,`${groups}그룹`,`피크 1시간 약 ${peak}잔 기준. ${groups===1?"소량 매장은 1그룹으로 충분":groups===2?"일반 매장 표준 구성":"피크가 높아 3그룹 또는 2그룹 2대 검토"}`,true,SPEC.espresso.kw[groups],SPEC.espresso.w[groups]);
    const g=cups>=250?2:1;
    add("grinder",g,g===2?"에스프레소용 2대(블렌드·디카페인 또는 예비)":"에스프레소용 1대",g===2?"하루 250잔 이상이면 그라인더 1대가 쉬지 못함":"한 가지 원두 운영 기준");
    add("tamper",1,"바스켓 지름에 맞춤(보통 58mm)","에스프레소 메뉴 필수 소도구");
    add("knock",1,"카운터 매립형 권장","추출 동선 바로 옆에 배치");
    add("pitcher",1,`스팀 피처 ${Math.max(2,groups*2)}개 이상`,"그룹당 2개 정도 돌려 쓰는 기준");
  }
  if(has("drip")) add("drip",1,cups>=200?"배치브루 + 핸드드립 소량":"핸드드립 세트 2~3구","필터커피 메뉴 운영",false);
  if(has("drip") && has("espresso")) add("grinder",1,"드립용 1대 추가","에스프레소와 드립 분쇄도가 달라 분리 권장",false);
  if(has("coldbrew")) add("coldbrew",1,"침출식 대용량 또는 점적식","콜드브루 메뉴 운영",false);
  // 얼음
  const iceNeed = cups*icer*0.18 + (has("smoothie")?cups*0.1*0.15:0);
  const iceDay = Math.ceil(iceNeed*1.3);
  const iceSize = ICE_SIZES.find(s=>s>=iceDay) || 200;
  if(iceNeed>0){
    add("ice",1,`일 생산 ${iceSize}kg급`,`아이스 1잔당 얼음 약 180g × ${Math.round(cups*icer)}잔 + 여유 30% ≈ 하루 ${iceDay}kg`);
  }
  // 냉장
  const fridgeW = cups<=100?1200:cups<=250?1500:1800;
  const fridgeN = (has("smoothie")||has("ade")||has("tea")) && cups>150 ? 2 : 1;
  add("tablefridge",fridgeN,`${fridgeW}mm${fridgeN>1?" ×2 (프론트·백)":""}`,"우유·시럽·과일청을 손 닿는 곳에 보관");
  if(has("cake")||has("bottle")) add("showcase",1,has("cake")&&has("bottle")?"케이크용 + 병음료용 각 1대 검토":has("cake")?"케이크용 사각/곡면 유리":"병음료용 수직형","진열 판매 메뉴가 있음",true,undefined,has("cake")&&has("bottle")?1600:900);
  if(has("bake")||has("smoothie")||iceDay>iceSize*0.85) add("freezer",1,"스탠드형 냉동고","냉동 과일·생지·여분 얼음 보관",false);
  // 음료
  if(has("smoothie")){ const b=cups>=300||peak>=60?2:1; add("blender",b,`방음 커버형 ${b}대`,b>1?"피크에 갈아 만드는 음료가 겹침":"스무디·프라페 메뉴 운영"); }
  add("hotwater",1,cups>=250?"20L 이상 직수형":"10L급 직수형","아메리카노·차 메뉴용 온수");
  if(has("ade")&&cups>=150) add("dispenser",1,"2구 냉음료 디스펜서","에이드·아이스티 베이스를 미리 만들어 두면 피크가 빨라짐",false);
  if(has("tea")) add("induction",1,"2구","청·시럽을 직접 끓여 만드는 경우",false);
  if(has("bake")) add("oven",1,"컨벡션 오븐 4단 내외","디저트 직접 굽기");
  if(has("waffle")) add("waffle",1,"2구","와플·토스트 메뉴");
  // 세척
  add("sink",1,seats>=20?"2구 + 손 세척 싱크 별도":"2구","설거지·손 세척");
  add("filter",has("espresso")?2:1,"머신·제빙기 각각 연결","스케일 방지와 맛 유지");
  const dish = seats>=20 || cups>=150;
  if(dish) add("dishwasher",1,"언더카운터 도어형","좌석 20석 이상 또는 하루 150잔 이상이면 손설거지가 밀림",seats>=30);
  if(seats>0) add("sterilizer",1,"자외선 컵 소독기","매장 컵·식기 위생 보관",false);
  // 운영
  add("pos",1,senior?"큰 화면·단순 메뉴의 POS(+키오스크 선택)":staff<=1?"POS + 키오스크":"POS",senior?"시니어 운영은 화면이 단순한 기종이 실수가 적음":staff<=1?"1인 운영이면 키오스크로 주문을 분산":"주문·결제");
  add("scale",has("espresso")?2:1,"0.1g 단위, 타이머 내장","레시피를 일정하게 유지" + (senior?" — 시니어 운영 매장에 특히 중요":""));

  // 합계
  const totalKw = rec.reduce((a,r)=>a+r.kw,0);
  const simKw = totalKw*0.7;
  const useFront = rec.filter(r=>r.z==="front").reduce((a,r)=>a+r.w,0);
  const useBack = rec.filter(r=>r.z==="back").reduce((a,r)=>a+r.w,0);
  const perStaff = peak/staff;

  // 경고
  const al=[];
  if(simKw>power) al.push(["bad","전력 초과",`동시 사용 추정 ${simKw.toFixed(1)}kW가 계약 전력 ${power}kW보다 큽니다. 냉난방·조명은 별도라 실제 여유는 더 적어요. 한전 증설이나 장비 축소를 검토하세요.`]);
  else if(simKw>power*0.75) al.push(["warn","전력 빠듯",`장비만으로 계약 전력의 ${Math.round(simKw/power*100)}%를 씁니다. 냉난방기를 더하면 차단기가 떨어질 수 있어요.`]);
  else al.push(["ok","전력 여유",`장비 동시 사용 추정 ${simKw.toFixed(1)}kW로 계약 전력 ${power}kW 안에 들어옵니다 (냉난방·조명 별도).`]);
  if(useFront>front) al.push(["bad","프론트 부족",`프론트에 올릴 장비 폭이 약 ${useFront.toLocaleString()}mm로 카운터(${front.toLocaleString()}mm)보다 깁니다. 작업 공간이 없어요.`]);
  else if(useFront>front*0.7) al.push(["warn","프론트 빠듯",`프론트 카운터의 ${Math.round(useFront/front*100)}%를 장비가 차지합니다. 음료 만들 작업 공간이 30% 이상 남는지 확인하세요.`]);
  if(useBack>back) al.push(["bad","백 부족",`백 카운터에 놓을 장비 폭(${useBack.toLocaleString()}mm)이 카운터 길이(${back.toLocaleString()}mm)보다 깁니다. 제빙기·냉동고를 바닥 독립형으로 빼는 것을 검토하세요.`]);
  if(perStaff>45) al.push(["warn","인력 부족",`피크 1시간에 직원 1명당 약 ${Math.round(perStaff)}잔입니다. 한 명이 시간당 40잔을 넘기면 대기가 길어져요.`]);
  if(groups===3) al.push(["warn","3그룹 전력",`3그룹 머신은 단독으로 6kW 이상 쓰는 경우가 많습니다. 전용 회로가 필요해요.`]);
  if(iceDay>iceSize*0.85) al.push(["warn","얼음 여유",`추정 필요량이 제빙기 생산량에 가깝습니다. 한 단계 큰 용량이나 냉동고 보관을 함께 쓰세요.`]);
  if(senior) al.push(["ok","시니어 운영",`버튼식 블렌더, 타이머 저울, POS 단순 화면처럼 실수를 줄이는 기종을 우선 고르세요.`]);
  if(area<12 && rec.length>16) al.push(["warn","공간 대비 장비",`${area}평에 장비 ${rec.length}종은 많은 편입니다. 선택 장비부터 줄여 보세요.`]);

  // 등급
  const pen = al.filter(a=>a[0]==="bad").length*2 + al.filter(a=>a[0]==="warn").length;
  const grade = pen===0?"A":pen<=1?"B":pen<=3?"C":"D";
  const gtxt = {A:"바로 진행 가능",B:"일부 확인 필요",C:"조정 필요",D:"재검토 필요"}[grade];

  renderReport({silent:!!silent,area,seats,type,cups,icer,peak,staff,power,front,back,rec,totalKw,simKw,useFront,useBack,iceDay,iceSize,al,grade,gtxt,groups});
}

const TYPE_N={takeout:"테이크아웃 중심",hall:"홀 중심 카페",dessert:"디저트 카페",senior:"시니어 운영 카페"};
function tone(r){return r>1?"bad":r>0.75?"warn":"ok"}

function renderReport(d){
  LAST=d;
  const R=document.getElementById("report");
  const must=d.rec.filter(r=>r.must).length;
  const pr=d.simKw/d.power, fr=d.useFront/d.front, br=d.useBack/d.back;
  const color={ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)"};
  // category breakdown
  const catCount={}; d.rec.forEach(r=>{const c=E.find(e=>e.id===r.id).cat; catCount[c]=(catCount[c]||0)+r.qty;});
  const maxC=Math.max(...Object.values(catCount));
  const kwList=d.rec.filter(r=>r.kw>0).sort((a,b)=>b.kw-a.kw);
  const maxKw=kwList.length?kwList[0].kw:1;
  const strip=(zone,len)=>{
    const items=d.rec.filter(r=>r.z===zone&&r.w>0);
    const used=items.reduce((a,r)=>a+r.w,0), total=Math.max(len,used);
    return `<div class="strip">${items.map(r=>{const e=E.find(x=>x.id===r.id);return `<div style="width:${r.w/total*100}%;background:${CATS[e.cat].color}" title="${e.name} ${r.w}mm">${e.name.replace(/[·].*/,"")}</div>`}).join("")}${len>used?`<div style="width:${(len-used)/total*100}%;background:repeating-linear-gradient(45deg,#f1f2f4,#f1f2f4 6px,#e6e8eb 6px,#e6e8eb 12px);color:var(--muted)">작업 공간 ${(len-used).toLocaleString()}mm</div>`:""}</div>
    <div class="striplbl"><span>장비 ${used.toLocaleString()}mm</span><span>카운터 ${len.toLocaleString()}mm</span></div>`;
  };
  R.innerHTML=`
  <div class="rhead">
    <div><h2>장비 구성 분석 리포트</h2>
    <p>${TYPE_N[d.type]} · ${d.area}평 · ${d.seats}석 · 하루 ${d.cups}잔 · 피크 1시간 약 ${d.peak}잔</p></div>
    <div class="grade"><b>${d.grade}</b><span>${d.gtxt}</span></div>
    <button id="toBar" class="tobar">이 조건으로 바 설계 →</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">추천 장비</div><div class="v">${d.rec.length}<small>종</small></div><div class="s">필수 ${must} · 선택 ${d.rec.length-must}</div></div>
    <div class="kpi"><div class="l">장비 전력 (동시 사용 추정)</div><div class="v">${d.simKw.toFixed(1)}<small>kW</small></div><div class="s tone-${tone(pr)}">계약 ${d.power}kW의 ${Math.round(pr*100)}%</div></div>
    <div class="kpi"><div class="l">하루 얼음 필요량</div><div class="v">${d.iceDay}<small>kg</small></div><div class="s">제빙기 ${d.iceSize}kg급 추천</div></div>
    <div class="kpi"><div class="l">프론트 카운터 점유</div><div class="v">${Math.round(fr*100)}<small>%</small></div><div class="s tone-${tone(fr/0.95)}">${d.useFront.toLocaleString()} / ${d.front.toLocaleString()}mm</div></div>
  </div>
  <div class="panel"><h3>진단</h3><p class="desc">입력한 조건으로 본 주의할 점</p>
    <div class="alerts">${d.al.map(a=>`<div class="alert ${a[0]}"><b>${a[1]}</b><span>${a[2]}</span></div>`).join("")}</div></div>
  <div class="two">
    <div class="panel"><h3>전력 부하</h3><p class="desc">장비 소비전력 합계 ${d.totalKw.toFixed(1)}kW × 동시 사용률 70% = ${d.simKw.toFixed(1)}kW</p>
      <div class="gauge"><div class="fill" style="width:${Math.min(pr,1.3)/1.3*100}%;background:${color[tone(pr)]}"></div><div class="cap" style="left:${1/1.3*100}%">계약 ${d.power}kW</div></div>
      <div class="bars" style="margin-top:18px">${kwList.slice(0,7).map(r=>{const e=E.find(x=>x.id===r.id);return `<div class="bar"><span>${e.name}${r.qty>1?" ×"+r.qty:""}</span><div class="t"><i style="width:${r.kw/maxKw*100}%;background:${CATS[e.cat].color}"></i></div><span class="n">${r.kw.toFixed(1)}kW</span></div>`}).join("")}</div>

function detect(q){
  const t=q.toLowerCase().replace(/\s+/g," ");
  let best=null,len=0;
  for(const [id,arr] of Object.entries(BRANDS)) for(const b of arr){
    if(t.includes(b.toLowerCase()) && b.length>len){best=id;len=b.length;}
  }
  if(!best){ // 장비 이름·별칭으로도
    for(const e of E){ for(const w of [e.name,...e.alias.split("·")].map(x=>x.trim().replace(/\s/g,""))){ if(w && t.replace(/\s/g,"").includes(w) && w.length>len){best=e.id;len=w.length;} } }
  }
  return best;
}

 {t:"tablefridge",n:"테이블 냉장고 1800 (일반 규격)",k:"테이블냉장고 1800",w:1800,d:700,generic:true}
];
function myProducts(){try{return JSON.parse(localStorage.getItem("eqMyProducts")||"[]")}catch(e){return []}}
function saveMyProduct(p){try{const l=[p,...myProducts().filter(x=>x.n!==p.n)].slice(0,30);localStorage.setItem("eqMyProducts",JSON.stringify(l))}catch(e){}}
function allProducts(){return [...myProducts().map(p=>({...p,mine:true})),...PRODUCTS];}
function findProducts(q,type){
  const t=(q||"").toLowerCase().replace(/\s+/g,"");
  return allProducts().filter(p=>(!type||p.t===type)&&(!t||(p.n+p.k+(p.k||"")).toLowerCase().replace(/\s+/g,"").includes(t)||t.split("").length>1&&(p.k||"").toLowerCase().split(" ").some(w=>w.length>1&&t.includes(w))));
}
function prodLine(p){return `${p.w}×${p.d}mm${p.kw?` · ${p.kw}kW`:""}${p.generic?" · 일반 규격":p.mine?" · 내가 입력":""}`;}
// 블록에 제품 적용
function applyProduct(block,p){ block.w=p.w; block.d=p.d; block.model=p.n; block.kw=p.kw; block.src=p.src||""; }
// 바 설계에 넣기 (상단 제품 검색에서)
function putProductInBar(p){
  if(!BAR) buildBar();
  const lists=[["front",BAR.front],["back",BAR.back],["uf",BAR.underF],["ub",BAR.underB]];
  let target=null;
  for(const [,l] of lists){ target=l.find(b=>b.id===p.t&&!b.model); if(target) break; }
  if(!target) for(const [,l] of lists){ target=l.find(b=>b.id===p.t); if(target) break; }
  if(!target){ const z=SPEC[p.t]?SPEC[p.t].z:"front"; target=makeBlock(p.t,p.w); (z==="back"?BAR.back:z==="under"?BAR.underF:BAR.front).splice(-1,0,target); }
  applyProduct(target,p); selUid=target.uid;
  document.getElementById("scrim").classList.remove("open");
  document.querySelector('nav button[data-v="bar"]').click(); renderBar();
  barMsg(`${p.n}(${p.w}×${p.d}mm)을 평면도에 넣었어요.`);
}

function bindProdPicker(sel){

// ===== 바 설계 =====
let LAST=null;           // 마지막 분석 결과
let BAR=null;            // {counters:{front:[...],back:[...]}, opts}
const BAR_ORDER_FRONT=["pos","showcase","espresso","knock","grinder","hotwater","WORK","blender","drip","PICKUP"];
const BAR_ORDER_BACK=["sink","sterilizer","induction","oven","waffle","freezer","coldbrew","WORK","dispenser","ice"];
let selUid=null, uidSeq=1;

function barOpts(){
  const g=id=>document.getElementById(id);
  return {shape:g("bShape").value, fd:+g("bFd").value, bd:+g("bBd").value, aisle:+g("bAisle").value, pick:g("bPick").value};
}
function makeBlock(id,w,label){return {uid:uidSeq++,id,w,label};}
function buildBar(){
  if(!LAST) analyze(true);
  const d=LAST, front=[], back=[], underF=[], underB=[];
  const expand=r=>{const n=(r.id==="tablefridge"||r.id==="dishwasher")?r.qty:r.qty; const one=r.w/Math.max(1,r.qty); return Array.from({length:n},()=>one);};
  const byId={}; d.rec.forEach(r=>byId[r.id]=r);
  const push=(arr,id)=>{const r=byId[id]; if(!r||r.w<=0) return; expand(r).forEach(w=>arr.push(makeBlock(id,w)));};
  BAR_ORDER_FRONT.forEach(id=>{ if(id==="WORK") front.push(makeBlock("WORK",0,"제조 작업대")); else if(id==="PICKUP") front.push(makeBlock("PICKUP",500,"픽업대")); else if(SPEC[id]&&SPEC[id].z==="front") push(front,id); });
  // 프론트 순서에 없지만 front 존인 장비
  d.rec.filter(r=>r.z==="front"&&!BAR_ORDER_FRONT.includes(r.id)).forEach(r=>push(front,r.id));
  BAR_ORDER_BACK.forEach(id=>{ if(id==="WORK") back.push(makeBlock("WORK",0,"작업대")); else if(SPEC[id]&&SPEC[id].z==="back") push(back,id); });
  d.rec.filter(r=>r.z==="back"&&!BAR_ORDER_BACK.includes(r.id)).forEach(r=>push(back,r.id));
  // 카운터 아래
  const tf=byId.tablefridge; if(tf){const w=parseInt(tf.spec)||1500; for(let i=0;i<tf.qty;i++)(i===0?underF:underB).push(makeBlock("tablefridge",w));}
  if(byId.dishwasher) underB.push(makeBlock("dishwasher",600));
  BAR={front,back,underF,underB,flen:d.front,blen:d.back};
  document.getElementById("bFl").value=d.front; document.getElementById("bBl").value=d.back;
  selUid=null; renderBar();
}
function flexW(list,len){const used=list.filter(b=>b.id!=="WORK").reduce((a,b)=>a+b.w,0);return Math.max(0,len-used);}
function nameOf(b){ if(b.label) return b.label; const e=E.find(x=>x.id===b.id); return e?e.name:b.id; }
function colorOf(b){ if(b.id==="WORK") return "#d9dde3"; if(b.id==="PICKUP") return "#f2c48d"; const e=E.find(x=>x.id===b.id); return e?CATS[e.cat].color:"#999"; }

function renderBar(){
  if(!BAR) return;
  const o=barOpts(), M=500;
  const fl=BAR.flen, bl=BAR.blen;
  // 픽업 위치에 따라 좌우 반전
  const F = o.pick==="left"?[...BAR.front].reverse():BAR.front;
  const counters=[]; // {key,x,y,len,depth,dir:'h'|'v',list,under}
  counters.push({key:"front",name:"프론트 카운터",x:M,y:M+600,len:fl,depth:o.fd,dir:"h",list:F,under:BAR.underF});
  if(o.shape==="parallel") counters.push({key:"back",name:"백 카운터",x:M,y:M+600+o.fd+o.aisle,len:bl,depth:o.bd,dir:"h",list:BAR.back,under:BAR.underB});
  else if(o.shape==="L"){ const atRight=o.pick!=="right"; counters.push({key:"back",name:"옆 카운터 (ㄱ자)",x:atRight?M+fl-o.bd:M,y:M+600+o.fd,len:bl,depth:o.bd,dir:"v",list:BAR.back,under:BAR.underB}); }
  // 일자형: 백 장비도 프론트 뒤에 이어서(한 줄)
  let single=o.shape==="line";
  if(single){ counters[0].list=[...F,...BAR.back.filter(b=>b.id!=="WORK")]; counters[0].under=[...BAR.underF,...BAR.underB]; }

  const maxX=Math.max(...counters.map(c=>c.dir==="h"?c.x+Math.max(c.len,sumW(c.list,c.len)):c.x+c.depth))+M;
  const maxY=Math.max(...counters.map(c=>c.dir==="h"?c.y+c.depth:c.y+Math.max(c.len,sumW(c.list,c.len))))+M+(o.shape==="parallel"?0:600);
  let svg=`<svg id="barsvg" viewBox="0 0 ${maxX} ${maxY}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR, sans-serif">
   <defs><pattern id="hatch" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="60" height="60" fill="#eef0f3"/><rect width="20" height="60" fill="#e2e5ea"/></pattern>
   <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6b4226"/></marker></defs>
   <rect width="${maxX}" height="${maxY}" fill="#fbfaf8"/>
   <rect x="${M}" y="${M}" width="${maxX-2*M}" height="520" fill="#f3ece3" rx="30"/>
   <text x="${M+40}" y="${M+130}" font-size="90" fill="#8a6a50" font-weight="700">손님 공간</text>`;
  const pos={}; // uid -> {cx,cy}
  counters.forEach(c=>{
    const total=Math.max(c.len,sumW(c.list,c.len)), over=sumW(c.list,c.len)>c.len;
    const W=c.dir==="h"?c.len:c.depth, H=c.dir==="h"?c.depth:c.len;
    svg+=`<rect x="${c.x}" y="${c.y}" width="${W}" height="${H}" fill="#fff" stroke="#3b3027" stroke-width="16"/>`;
    // under
    let u=0; c.under.forEach(b=>{ const L=b.w; const r=c.dir==="h"?[c.x+u,c.y+c.depth*0.55,L,c.depth*0.42]:[c.x+c.depth*0.03,c.y+u,c.depth*0.42,L];
      svg+=`<g class="ublk" data-uid="${b.uid}" style="cursor:pointer"><rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${b.uid===selUid?"#00000010":"#ffffff01"}" stroke="${b.uid===selUid?"#111":colorOf(b)}" stroke-width="${b.uid===selUid?16:10}" stroke-dasharray="40 25"/></g>`;
      const tx=r[0]+r[2]/2, ty=r[1]+r[3]/2, ufs=Math.min(70,L/11); svg+=`<text pointer-events="none" x="${tx}" y="${ty}" font-size="${ufs}" fill="${colorOf(b)}" text-anchor="middle" dominant-baseline="middle" ${c.dir==="v"?`transform="rotate(90 ${tx} ${ty})"`:""}>아래: ${b.model||nameOf(b)} ${L}${b.d?"×"+b.d:""}</text>`; u+=L; });
    let t=0;
    c.list.forEach(b=>{
      const L=b.id==="WORK"?flexW(c.list,c.len):b.w; if(L<=0){t+=0;return;}
      const pad=30;
      const fr=b.d?Math.min(1,b.d/c.depth):(c.under.length?0.5:1), hh=(c.depth-pad*2)*fr;
      const r=c.dir==="h"?[c.x+t,c.y+pad,L,hh]:[c.x+c.depth-pad-hh,c.y+t,hh,L];
      const sel=b.uid===selUid, out=t+L>c.len||(b.d&&b.d>c.depth);
      const fill=b.id==="WORK"?"url(#hatch)":colorOf(b);
      svg+=`<g class="blk" data-uid="${b.uid}" data-c="${c.key}" style="cursor:grab"><rect x="${r[0]+6}" y="${r[1]}" width="${Math.max(0,r[2]-12)}" height="${r[3]}" rx="18" fill="${fill}" fill-opacity="${b.id==="WORK"?1:.9}" stroke="${out?"#c0392b":sel?"#111":"none"}" stroke-width="${out||sel?18:0}" ${out?'stroke-dasharray="40 20"':""}/>`;
      const tx=r[0]+r[2]/2, ty=r[1]+r[3]/2, fs=Math.min(78,Math.max(46,(c.dir==="h"?L:r[2])/6));
      const nm=(b.model&&L>=450?(b.model.length>14?b.model.slice(0,13)+"…":b.model):(b.model?b.model.split(" ").slice(-1)[0]:nameOf(b).replace(/[·].*/,""))), tc=b.id==="WORK"?"#555":"#fff";
      svg+=`<text x="${tx}" y="${ty-20}" font-size="${fs}" font-weight="700" fill="${tc}" text-anchor="middle" dominant-baseline="middle" pointer-events="none" ${c.dir==="v"?`transform="rotate(90 ${tx} ${ty})"`:""}>${nm}</text>
            <text x="${tx}" y="${ty+fs*0.75}" font-size="${fs*0.8}" fill="${tc}" fill-opacity=".85" text-anchor="middle" dominant-baseline="middle" pointer-events="none" ${c.dir==="v"?`transform="rotate(90 ${tx} ${ty})"`:""}>${L}${b.d?"×"+b.d:""}</text></g>`;
      pos[b.uid]={cx:tx,cy:ty,b,c:c.key};
      t+=L;
    });
    // 치수
    if(c.dir==="h"){ const yy=c.key==="front"?c.y-70:c.y+c.depth+90;
      svg+=`<line x1="${c.x}" y1="${yy}" x2="${c.x+c.len}" y2="${yy}" stroke="#555" stroke-width="6"/><line x1="${c.x}" y1="${yy-30}" x2="${c.x}" y2="${yy+30}" stroke="#555" stroke-width="6"/><line x1="${c.x+c.len}" y1="${yy-30}" x2="${c.x+c.len}" y2="${yy+30}" stroke="#555" stroke-width="6"/>
      <text x="${c.x+c.len/2}" y="${yy+(c.key==="front"?-25:75)}" font-size="70" text-anchor="middle" fill="${over?"#c0392b":"#333"}" font-weight="700">${c.name} ${c.len.toLocaleString()} × ${c.depth}${over?` (장비 ${sumW(c.list,c.len).toLocaleString()} — 넘침)`:""}</text>`;
    } else { const xx=c.x+c.depth+80;
      svg+=`<text x="${xx}" y="${c.y+c.len/2}" font-size="70" fill="${over?"#c0392b":"#333"}" font-weight="700" transform="rotate(90 ${xx} ${c.y+c.len/2})" text-anchor="middle">${c.name} ${c.len.toLocaleString()} × ${c.depth}${over?" (넘침)":""}</text>`; }
  });
  // 통로
  if(o.shape==="parallel"){ const f=counters[0], y1=f.y+f.depth, y2=y1+o.aisle, xx=f.x+Math.min(f.len,counters[1].len)+250;
    svg+=`<line x1="${xx}" y1="${y1}" x2="${xx}" y2="${y2}" stroke="${o.aisle<900?"#c0392b":"#2e8b57"}" stroke-width="8" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="${xx+40}" y="${(y1+y2)/2+25}" font-size="70" fill="${o.aisle<900?"#c0392b":"#2e8b57"}" font-weight="700">통로 ${o.aisle}</text>
    <text x="${f.x+40}" y="${(y1+y2)/2+25}" font-size="60" fill="#888">직원 동선</text>`; }
  // 흐름 번호
  const find=id=>Object.values(pos).find(p=>p.b.id===id);
  const steps=[["pos","① 주문"],["espresso","② 제조"],["PICKUP","③ 픽업"]];
  steps.forEach(([id,t])=>{const p=find(id); if(!p) return; svg+=`<g pointer-events="none"><circle cx="${p.cx}" cy="${M+340}" r="65" fill="#6b4226"/><text x="${p.cx}" y="${M+364}" font-size="70" fill="#fff" text-anchor="middle" font-weight="700">${t[0]}</text><text x="${p.cx}" y="${M+245}" font-size="62" fill="#6b4226" text-anchor="middle" font-weight="700">${t.slice(2)}</text></g>`;});
  svg+=`</svg>`;
  document.getElementById("barcanvas").innerHTML=svg;
  bindDrag();
  renderBarSide(counters,pos,o);
}
function sumW(list,len){return list.filter(b=>b.id!=="WORK").reduce((a,b)=>a+b.w,0)+(list.some(b=>b.id==="WORK")?0:0);}

function renderBarSide(counters,pos,o){
  const chk=[]; const P=id=>Object.values(pos).filter(p=>p.b.id===id);
  const dist=(a,b)=>Math.hypot(a.cx-b.cx,a.cy-b.cy);
  if(o.shape==="parallel"){
    if(o.aisle<900) chk.push(["bad",`통로 ${o.aisle}mm는 좁습니다. 한 사람이 지나가려면 최소 900mm, 두 사람이 엇갈리면 1,000~1,200mm가 필요해요.`]);
    else if(LAST&&LAST.staff>=3&&o.aisle<1100) chk.push(["warn",`피크 ${LAST.staff}명 근무면 통로를 1,100mm 이상으로 잡는 게 편해요.`]);
    else chk.push(["ok",`통로 ${o.aisle}mm — 직원 동선 여유 괜찮아요.`]);
  }
  counters.forEach(c=>{const u=sumW(c.list,c.len); if(u>c.len) chk.push(["bad",`${c.name}: 장비 폭 ${u.toLocaleString()}mm가 카운터 ${c.len.toLocaleString()}mm보다 ${(u-c.len).toLocaleString()}mm 깁니다. 빨간 점선 장비를 다른 카운터로 옮기거나 카운터를 늘리세요.`]);
    else { const w=c.len-u; if(c.key==="front"&&w<800) chk.push(["warn",`프론트 작업 공간이 ${w}mm뿐이에요. 음료를 만들려면 800mm 이상 남기는 게 좋아요.`]); }
    const ul=c.under.reduce((a,b)=>a+b.w,0); if(ul>c.len) chk.push(["warn",`${c.name} 아래 장비(${ul.toLocaleString()}mm)가 카운터보다 깁니다.`]);
    c.list.filter(b=>b.d&&b.d>c.depth).forEach(b=>chk.push(["bad",`${b.model||nameOf(b)} 깊이 ${b.d}mm가 ${c.name} 깊이 ${c.depth}mm보다 깊어요. 카운터 깊이를 늘리거나 다른 카운터로 옮기세요.`]));
    c.list.filter(b=>b.d&&b.d<=c.depth&&c.depth-b.d<100&&b.id==="espresso").forEach(b=>chk.push(["warn",`${b.model||nameOf(b)} 앞 여유가 ${c.depth-b.d}mm뿐이에요. 머신 앞에 피처·컵 놓을 자리를 생각하면 카운터 깊이를 조금 더 잡는 게 좋아요.`]));
    c.under.filter(b=>b.d&&b.d>c.depth).forEach(b=>chk.push(["warn",`카운터 아래 ${b.model||nameOf(b)} 깊이 ${b.d}mm가 카운터 깊이 ${c.depth}mm보다 깊어 앞으로 튀어나와요.`])); });
  const es=P("espresso")[0], gr=P("grinder")[0], hw=P("hotwater")[0], bl=P("blender")[0], ic=P("ice")[0];
  if(es&&gr) chk.push(dist(es,gr)<=1300?["ok","그라인더가 에스프레소 머신 바로 옆에 있어요."]:["warn","그라인더를 에스프레소 머신 바로 옆으로 붙이세요. 떨어지면 추출 동선이 길어져요."]);
  if(es&&hw) chk.push(dist(es,hw)<=1800?["ok","온수기가 머신 가까이 있어 아메리카노 동선이 짧아요."]:["warn","온수기를 머신 가까이 두면 아메리카노가 빨라져요."]);
  if(bl&&ic) chk.push(dist(bl,ic)<=2200?["ok","블렌더와 제빙기가 가까워요."]:["warn","블렌더와 제빙기가 멀어요. 얼음을 들고 오가는 거리가 길어집니다. 제빙기를 블렌더 등 뒤쪽으로 옮겨 보세요."]);
  if(P("PICKUP")[0]&&P("pos")[0]&&o.shape!=="line") chk.push(["ok","주문(①)과 픽업(③)이 양 끝으로 나뉘어 손님 줄이 엉키지 않아요."]);
  chk.push(["warn","에스프레소 머신·제빙기·식기세척기는 급수·배수와 전용 전기가 필요해요. 배관·콘센트 위치를 이 배치에 맞춰 시공 업체와 확인하세요."]);
  const sel=selUid?findBlock(selUid):null;
  document.getElementById("barside").innerHTML=`
    ${sel?`<div class="panel selp"><h3>선택: ${nameOf(sel.b)}</h3><p class="desc">${sel.b.id==="WORK"?"남는 길이가 자동으로 작업대가 됩니다.":`${sel.b.model?`<b style="color:var(--ink)">${sel.b.model}</b><br>`:""}폭 ${sel.b.w}mm${sel.b.d?` × 깊이 ${sel.b.d}mm`:" (깊이 미지정)"}${sel.b.kw?` · ${sel.b.kw}kW`:""}${sel.b.src?` · <a href="${sel.b.src}" target="_blank" rel="noopener">사양 출처</a>`:""}`}</p>
      <div class="selbtn"><button data-a="left">← 왼쪽</button><button data-a="right">오른쪽 →</button>${o.shape!=="line"?`<button data-a="swap">${{front:"백 카운터로",back:"프론트로",uf:"백 카운터 아래로",ub:"프론트 아래로"}[sel.key]}</button>`:""}${sel.b.id!=="WORK"?`<button data-a="del">빼기</button>`:""}</div>
      ${sel.b.id!=="WORK"?`<label class="wlab">폭(mm) <input type="number" id="selW" value="${sel.b.w}" step="10" min="100"></label>`:""}
      ${sel.b.id!=="WORK"&&sel.b.id!=="PICKUP"?prodPickerHtml(sel):""}</div>`
     :`<div class="panel"><p class="desc" style="margin:0">평면도의 장비를 <b>끌어서</b> 순서를 바꾸거나 다른 카운터로 옮길 수 있어요. 눌러서 선택하면 폭을 바꾸거나 뺄 수 있습니다.</p></div>`}
    <div class="panel"><h3>배치 점검</h3><div class="alerts">${chk.map(a=>`<div class="alert ${a[0]}"><span>${a[1]}</span></div>`).join("")}</div></div>
    <div class="panel"><h3>배치 목록</h3>${counters.map(c=>`<b style="font-size:13px">${c.name}</b><ol class="blist">${c.list.map(b=>`<li>${b.model?`<b>${b.model}</b>`:nameOf(b)} <span>${b.id==="WORK"?flexW(c.list,c.len):b.w}mm</span></li>`).join("")}${c.under.map(b=>`<li class="u" data-uid="${b.uid}" style="cursor:pointer">아래: ${b.model||nameOf(b)} <span>${b.w}${b.d?"×"+b.d:""}mm</span></li>`).join("")}</ol>`).join("")}</div>`;
  document.querySelectorAll(".selbtn button").forEach(b=>b.onclick=()=>actSel(b.dataset.a));
  document.querySelectorAll(".blist li.u").forEach(li=>li.onclick=()=>{selUid=+li.dataset.uid; renderBar();});
  const sw=document.getElementById("selW"); if(sw) sw.onchange=()=>{const s=findBlock(selUid); if(s){s.b.w=Math.max(100,+sw.value||s.b.w); renderBar();}};
  if(sel&&sel.b.id!=="WORK"&&sel.b.id!=="PICKUP") bindProdPicker(sel);
}
function listOf(key){return {front:BAR.front,back:BAR.back,uf:BAR.underF,ub:BAR.underB}[key];}
function findBlock(uid){for(const key of ["front","back","uf","ub"]){const l=listOf(key),i=l.findIndex(b=>b.uid===uid); if(i>=0) return {key,i,b:l[i],list:l};} return null;}
function actSel(a){
  const s=findBlock(selUid); if(!s) return; const o=barOpts(); const flip=(o.pick==="left"&&(s.key==="front"));
  if(a==="left"||a==="right"){ let dir=a==="left"?-1:1; if(flip) dir=-dir; const j=s.i+dir; if(j<0||j>=s.list.length) return; [s.list[s.i],s.list[j]]=[s.list[j],s.list[s.i]]; }
  if(a==="swap"){ if(s.b.id==="WORK") return; s.list.splice(s.i,1); listOf({front:"back",back:"front",uf:"ub",ub:"uf"}[s.key]).push(s.b); }
  if(a==="del"){ s.list.splice(s.i,1); selUid=null; }
  renderBar();
}
function bindDrag(){
  const svg=document.getElementById("barsvg"); if(!svg) return;
  svg.querySelectorAll(".ublk").forEach(g=>g.addEventListener("click",()=>{const u=+g.dataset.uid; selUid=selUid===u?null:u; renderBar();}));
  const pt=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  svg.querySelectorAll(".blk").forEach(g=>{
    g.addEventListener("pointerdown",ev=>{
      ev.preventDefault(); const uid=+g.dataset.uid; const start=pt(ev); let moved=false;
      g.setPointerCapture(ev.pointerId); g.style.cursor="grabbing";
      const mv=e=>{const p=pt(e); const dx=p.x-start.x, dy=p.y-start.y; if(Math.abs(dx)+Math.abs(dy)>40) moved=true; g.setAttribute("transform",`translate(${dx} ${dy})`); g.style.opacity=.75;};
      const up=e=>{g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);
        if(!moved){selUid=selUid===uid?null:uid; renderBar(); return;}
        dropAt(uid,pt(e)); };
      g.addEventListener("pointermove",mv); g.addEventListener("pointerup",up);
    });
  });
}
function dropAt(uid,p){
  const s=findBlock(uid); if(!s) return;
  // 가장 가까운 카운터와 그 안의 위치 계산
  const others=[...document.querySelectorAll("#barsvg .blk")].filter(g=>+g.dataset.uid!==uid).map(g=>{const r=g.querySelector("rect");const x=+r.getAttribute("x"),y=+r.getAttribute("y"),w=+r.getAttribute("width"),h=+r.getAttribute("height");return {uid:+g.dataset.uid,c:g.dataset.c,cx:x+w/2,cy:y+h/2};});
  if(!others.length) return;
  let best=others[0],bd=1e12; others.forEach(o=>{const d=Math.hypot(o.cx-p.x,(o.cy-p.y)*1.5); if(d<bd){bd=d;best=o;}});
  const o=barOpts(), vertical=o.shape==="L"&&best.c==="back";
  const target=findBlock(best.uid); if(!target) return;
  if(o.shape==="line" && s.key!==target.key) return renderBar();
  s.list.splice(s.i,1);
  const t2=findBlock(best.uid);
  let after = vertical ? p.y>best.cy : p.x>best.cx;
  if(o.pick==="left"&&t2.key==="front"&&!vertical) after=!after;
  t2.list.splice(t2.i+(after?1:0),0,s.b);
  selUid=uid; renderBar();
}
function svgText(){const s=document.getElementById("barsvg"); return s?new XMLSerializer().serializeToString(s):"";}
function barSavePng(){
  if(!/github\.io$/.test(location.hostname)&&location.protocol!=="file:"){barMsg("이 화면에서는 파일 저장이 막혀 있어요. 원클리어 사이트(github.io) 주소에서 PNG 저장을 누르거나 화면을 캡처해 주세요.");return;}
  const txt=svgText(); if(!txt) return; const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas"); const vb=document.getElementById("barsvg").viewBox.baseVal; const k=2400/vb.width; c.width=2400; c.height=Math.round(vb.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="바설계.png";document.body.appendChild(a);a.click();a.remove();barMsg("PNG를 저장했어요. 저장이 안 되면 화면을 캡처해 주세요.");}catch(e){barMsg("이 화면에서는 저장이 막혀 있어요. 화면을 캡처해 주세요.");}});};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(txt);
}
function barMsg(t){const m=document.getElementById("barmsg"); m.textContent=t; setTimeout(()=>m.textContent="",4000);}
["bShape","bFd","bBd","bAisle","bPick"].forEach(id=>document.getElementById(id).addEventListener("change",renderBar));
["bFl","bBl"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{if(!BAR)return;BAR.flen=Math.max(500,+document.getElementById("bFl").value||BAR.flen);BAR.blen=Math.max(500,+document.getElementById("bBl").value||BAR.blen);renderBar();}));
document.getElementById("bReset").onclick=buildBar;
document.getElementById("bPng").onclick=barSavePng;
document.getElementById("bPrint").onclick=()=>{try{window.print()}catch(e){barMsg("인쇄가 막혀 있어요. 브라우저 메뉴에서 인쇄해 주세요.")}};
function openBar(){ document.querySelector('nav button[data-v="bar"]').click(); buildBar(); }
</script>
